<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Booky · Leituras pessoais</title>
<meta name="theme-color" content="#263C20">
<meta name="description" content="Seu diário pessoal de leitura: estante, progresso, citações e estatísticas.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..200&display=block" rel="stylesheet">

<style>
  :root{
    --brand:#263C20;
    --brand-dark:#1A2B16;
    --brand-light:#4A6741;
    --sage:#8FA883;
    --sage-soft:#DBE6D4;
    --accent:#C98A3E;
    --accent-soft:#F1DECB;
    --paper:#FFFFFF;
    --surface:#F2F4EE;
    --surface-strong:#E9ECE3;
    --border:#E9EBE3;
    --ink:#22301D;
    --ink-soft:#5C6B54;
    --ink-faint:#97A190;
    --danger:#B5482E;
    --danger-soft:#FAE4DE;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:14px;
    --ease:cubic-bezier(.4,0,.2,1);
    --shadow-sm:0 1px 2px rgba(34,48,29,.05);
    --shadow-md:0 10px 26px rgba(34,48,29,.08);

    /* paleta de tags da estante */
    --tag-todos:#8B7FD8;
    --tag-lido:#4FAE68;
    --tag-lendo:#E3B23C;
    --tag-quero_ler:#4A8FDB;
    --tag-relendo:#E3813C;
    --tag-abandonado:#9AA1A6;
    --tag-favoritos:#DE5B5B;
    --tag-tem_em_casa:var(--brand);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope', system-ui, sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; -webkit-appearance:none; appearance:none;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--sage-soft); color:var(--brand-dark);}
  a{color:inherit;}
  img{display:block; max-width:100%;}

  .msym{
    font-family:'Material Symbols Outlined';
    font-weight:normal; font-style:normal;
    display:inline-block; line-height:1; white-space:nowrap;
    word-wrap:normal; direction:ltr;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:'liga';
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    vertical-align:middle;
    user-select:none;
    transition:font-variation-settings .25s cubic-bezier(.4,0,.2,1), color .15s;
  }
  .msym.filled{ font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }

  ::view-transition-old(root),
  ::view-transition-new(root){
    animation-duration:.26s;
    animation-timing-function:cubic-bezier(.4,0,.2,1);
  }

  @keyframes fade-up{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .fade-in{animation:fade-up .4s var(--ease) both;}

  #app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Login / Signup ---------- */
  #auth-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }
  .auth-logo{
    width:60px; height:60px;
    border-radius:20px;
    background:var(--brand);
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
    box-shadow:0 6px 16px rgba(38,60,32,0.25);
  }
  .auth-title{font-size:24px; text-align:center; margin-bottom:6px;}
  .auth-sub{font-size:14px; color:var(--ink-soft); text-align:center; max-width:280px; margin-bottom:28px; line-height:1.45;}
  .auth-card{
    width:100%;
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:24px;
    box-shadow:var(--shadow-md);
  }
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft);}
  .field input, .field textarea, .field select{
    width:100%;
    border:1px solid var(--border);
    background:var(--paper);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field textarea{resize:none;}
  .field input:focus, .field textarea:focus, .field select:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(38,60,32,0.12);
  }
  .form-error{
    background:var(--danger-soft);
    color:var(--danger);
    font-size:13px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    margin-bottom:14px;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--brand);
    color:var(--paper);
    border:none;
    border-radius:var(--radius-sm);
    padding:13px 18px;
    font-size:14.5px;
    font-weight:700;
    transition:background .18s var(--ease), opacity .18s var(--ease), transform .12s var(--ease);
  }
  .btn:hover{background:var(--brand-dark);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{background:var(--sage-soft); color:var(--brand-dark);}
  .btn-danger{background:var(--danger);}
  .btn-danger:hover{background:#9a3a24;}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  .auth-switch{
    text-align:center;
    margin-top:20px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .auth-switch button{
    background:none; border:none; color:var(--brand);
    font-weight:700; font-size:13.5px; padding:0;
  }

  /* ---------- App shell ---------- */
  #app-shell{display:none; flex:1; flex-direction:column; min-height:100vh;}
  #app-shell.active{display:flex;}

  header.topbar{
    position:sticky; top:0; z-index:20;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:14px 20px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 1px 0 rgba(34,48,29,.06);
  }
  .brand-mark{display:flex; align-items:center; gap:9px; justify-self:center;}
  .brand-mark span{font-size:32px; font-weight:800; color:var(--brand);}
  .topbar-side{display:flex; align-items:center;}
  .topbar-side:first-child{justify-content:flex-start;}
  .topbar-side:last-child{justify-content:flex-end;}
  .avatar{
    width:32px; height:32px; border-radius:50%;
    background:var(--sage-soft); color:var(--brand-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
    flex-shrink:0;
  }
  .avatar.lg{width:64px; height:64px; font-size:20px; background:var(--brand); color:var(--paper);}
  .avatar.xl{width:160px; height:160px; font-size:50px; background:var(--brand); color:var(--paper); margin:0 auto;}
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    border:none; background:transparent; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:var(--sage-soft); color:var(--brand-dark);}

  main.view{flex:1; padding:18px 20px 90px;}

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:sticky; bottom:0; z-index:20;
    display:flex; align-items:flex-end; justify-content:space-between;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 -1px 0 rgba(34,48,29,.06);
    padding:8px 10px 10px;
  }
  .nav-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--ink-faint);
    padding:6px 2px; font-size:10.5px; font-weight:700;
  }
  .nav-item .nav-ico{
    width:34px; height:34px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:inherit;
  }
  .nav-item.active{color:var(--brand);}
  .nav-item.active .nav-ico{background:var(--sage-soft);}
  .nav-item.active .msym{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;}
  .fab-registro{
    position:fixed; right:20px; bottom:90px; z-index:19;
    width:56px; height:56px; border-radius:50%;
    background:var(--brand); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(38,60,32,0.35);
    transition:background .15s var(--ease), transform .15s var(--ease);
  }
  .fab-registro:hover{background:var(--brand-dark);}
  .fab-registro:active{transform:scale(.94);}

  .btn-sair-fixed{
    position:fixed; left:20px; right:20px; bottom:90px; z-index:19;
    max-width:380px; margin:0 auto;
  }

  /* ---------- Generic building blocks ---------- */
  .page-title{font-size:22px; margin-bottom:4px;}
  .page-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}
  .row-between{display:flex; align-items:center; justify-content:space-between;}
  .section-title{font-size:14px; font-weight:800; margin:22px 0 12px;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:var(--shadow-sm);
  }
  .card-tap{transition:transform .18s var(--ease), box-shadow .18s var(--ease);}
  .card-tap:active{transform:scale(0.98);}
  a.card-tap, .card-tap[role="button"]{text-decoration:none; display:block; color:inherit;}

  .empty-note{
    border:1px dashed var(--border);
    border-radius:var(--radius-lg);
    padding:26px 18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .empty-note .msym{margin-bottom:8px; color:var(--ink-faint);}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat-grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .stat-box{
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:15px 6px;
    text-align:center;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat-box .num{font-size:20px; font-weight:800; color:var(--brand);}
  .stat-box .lbl{font-size:10.5px; color:var(--ink-soft); line-height:1.25;}

  .status-pill{
    display:inline-flex; align-items:center; gap:5px;
    border-radius:999px; padding:5px 12px;
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    border:none;
  }
  .status-quero_ler{background:var(--tag-quero_ler); color:#fff;}
  .status-lendo{background:var(--tag-lendo); color:#fff;}
  .status-lido{background:var(--tag-lido); color:#fff;}
  .status-relendo{background:var(--tag-relendo); color:#fff;}
  .status-abandonado{background:var(--tag-abandonado); color:#fff;}


  .search-box{position:relative; margin-bottom:14px;}
  .search-box .msym{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .search-box input{
    width:100%; padding:12px 14px 12px 42px;
    border:1px solid var(--border); background:var(--paper);
    border-radius:var(--radius-sm); font-size:14px; color:var(--ink);
    outline:none; transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .search-box input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(38,60,32,0.12);}

  /* ---------- Estante: cabeçalho, filtros e grade ---------- */
  .estante-top{display:flex; gap:10px; align-items:stretch; margin-bottom:16px;}
  .estante-header-card{
    flex:1; min-width:0;
    background:var(--surface); border-radius:var(--radius-lg);
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .estante-header-card .eh-title{font-size:19px; font-weight:800; color:var(--ink);}
  .estante-header-card .eh-pagi{text-align:right; flex-shrink:0;}
  .estante-header-card .eh-pagi-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
  .estante-header-card .eh-pagi-num{font-size:18px; font-weight:800; color:var(--ink);}
  .estante-search-btn{
    flex-shrink:0; width:56px; border-radius:var(--radius-lg);
    background:var(--surface); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .estante-search-btn.active{background:var(--brand); color:var(--paper);}

  .estante-filter-row{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 4px; margin-bottom:14px;}
  .estante-filter-row::-webkit-scrollbar{display:none;}
  .estante-chip{
    flex-shrink:0; width:44px; height:44px; border-radius:50%;
    background:var(--surface-strong); color:var(--chip-color, var(--ink-soft));
    display:flex; align-items:center; justify-content:center; gap:7px;
    transition:width .18s var(--ease), background .18s var(--ease), padding .18s var(--ease);
  }
  .estante-chip .msym{font-size:20px; flex-shrink:0;}
  .estante-chip .label{display:none; font-size:13px; font-weight:700; color:#fff; white-space:nowrap;}
  .estante-chip.active{
    width:auto; padding:0 18px; background:var(--chip-color); color:#fff;
    border-radius:var(--radius-sm);
  }
  .estante-chip.active .label{display:inline;}

  .estante-count{font-size:14px; font-weight:700; color:var(--ink); margin:2px 0 14px;}

  .book-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .book-card{
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);
  }
  .book-card .book-cover{
    border-radius:var(--radius-md) var(--radius-md) 0 0;
    overflow:hidden;
  }
  .book-cover{
    width:100%; aspect-ratio:3/4;
    background:linear-gradient(160deg, var(--sage-soft), var(--brand-light) 140%);
    display:flex; align-items:center; justify-content:center;
    padding:8px; text-align:center;
    color:var(--brand-dark); font-weight:800; font-size:11px; line-height:1.3;
    overflow:hidden;
  }
  .book-cover > span{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .book-cover img{width:100%; height:100%; object-fit:cover;}

  .book-card{position:relative;}
  .book-ribbon{
    position:absolute; top:0; left:9px; z-index:2;
    width:16px; height:24px; background:var(--ribbon-color, var(--tag-quero_ler));
    clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .book-info{
    padding:8px 4px 2px;
    display:flex; align-items:center; justify-content:space-between; gap:4px;
    position:relative;
  }
  .book-info .bi-badges{display:flex; align-items:center; gap:6px; min-width:0; flex-wrap:wrap;}
  .book-info .bi-pct{font-size:11.5px; font-weight:800; color:var(--ink);}
  .book-info .bi-rating{display:flex; align-items:center; gap:2px; font-size:11px; font-weight:800; color:var(--accent);}
  .book-info .bi-rating .msym{font-size:12px;}
  .book-card-menu-btn{
    width:24px; height:24px; border-radius:50%; flex-shrink:0; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
  }
  .book-card-menu-btn:hover{background:var(--surface-strong);}
  .book-card-menu{
    position:absolute; bottom:34px; right:2px; z-index:15;
    background:var(--paper); border-radius:var(--radius-sm); box-shadow:var(--shadow-md);
    width:190px; overflow:hidden; display:none;
  }
  .book-grid .book-card:nth-child(3n+1) .book-card-menu{left:2px; right:auto;}
  .book-card-menu.open{display:block;}
  .book-card-menu button{
    display:flex; align-items:center; gap:9px; width:100%; padding:11px 14px;
    font-size:12.5px; color:var(--ink); text-align:left;
  }
  .book-card-menu button:hover{background:var(--surface-strong);}
  .book-card-menu button.danger{color:var(--danger);}
  .book-card-menu button.danger:hover{background:var(--danger-soft);}

  .book-list-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border-radius:var(--radius-md); padding:9px; margin-bottom:9px;
    box-shadow:var(--shadow-sm);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .book-list-row .thumb{width:38px; height:52px; border-radius:8px; overflow:hidden; flex-shrink:0;}
  .book-list-row .meta{min-width:0; flex:1;}
  .book-list-row .meta p:first-child{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .book-list-row .meta p:last-child{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .progress-track{width:100%; height:7px; border-radius:999px; background:var(--sage-soft); overflow:hidden;}
  .progress-fill{height:100%; background:var(--brand); border-radius:999px; transition:width .25s;}

  .stars{display:flex; gap:5px;}
  .star-btn{background:none; border:none; padding:2px; color:var(--border); display:flex;}
  .star-btn.filled{color:var(--accent);}
  .star-btn .msym{font-size:24px;}

  .mood-row{display:flex; gap:8px;}
  .mood-btn{
    width:38px; height:38px; border-radius:12px;
    border:1px solid var(--border); background:var(--paper); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .mood-btn.active{background:var(--brand); border-color:var(--brand); color:var(--paper);}

  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
  .checkbox-row input{width:16px; height:16px; accent-color:var(--brand);}

  .type-toggle{display:flex; gap:8px; margin-bottom:12px;}
  .type-toggle button{
    flex:1; padding:9px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--paper); color:var(--ink-soft);
    font-size:12.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .type-toggle button.active{background:var(--brand); border-color:var(--brand); color:var(--paper);}

  .entry-item{
    background:var(--surface);
    border-radius:var(--radius-md); padding:13px; margin-bottom:10px;
    box-shadow:var(--shadow-sm);
  }
  .entry-head{display:flex; align-items:center; justify-content:between; gap:8px; margin-bottom:7px; font-size:11.5px; color:var(--ink-faint);}
  .entry-head .ico{width:26px; height:26px; border-radius:8px; background:var(--sage-soft); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .entry-text{font-size:13.5px; color:var(--ink); line-height:1.5;}
  .entry-text.quote{font-style:italic; position:relative; padding-left:6px; border-left:3px solid var(--accent);}
  .entry-text.spoiler{filter:blur(4px); transition:filter .15s;}
  .entry-text.spoiler:active, .entry-text.spoiler.revealed{filter:none;}

  .feed-book-tag{font-size:11.5px; font-weight:700; color:var(--brand);}

  /* ---------- Feed entry (histórico de leitura) ---------- */
  .feed-entry{
    background:var(--surface); border-radius:var(--radius-lg);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow-sm);
  }
  .feed-entry-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:11px; position:relative;}
  .feed-entry-who{flex:1; min-width:0;}
  .feed-entry-who .name{font-size:13.5px; font-weight:800; color:var(--ink); line-height:1.3;}
  .feed-entry-who .action{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .feed-entry-date{font-size:11px; color:var(--ink-faint); white-space:nowrap; margin-top:2px; flex-shrink:0;}
  .feed-entry-menu-btn{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
    transition:background .15s var(--ease);
  }
  .feed-entry-menu-btn:hover{background:var(--surface-strong);}
  .feed-entry-menu{
    position:absolute; top:32px; right:0; z-index:10;
    background:var(--paper); border-radius:var(--radius-sm); box-shadow:var(--shadow-md);
    overflow:hidden; display:none; width:190px;
  }
  .feed-entry-menu.open{display:block;}
  .feed-entry-menu button{
    display:flex; align-items:center; gap:9px; width:100%; padding:11px 14px;
    font-size:13px; color:var(--ink); text-align:left;
  }
  .feed-entry-menu button:hover{background:var(--surface-strong);}
  .feed-entry-menu button.danger{color:var(--danger);}
  .feed-entry-menu button.danger:hover{background:var(--danger-soft);}
  .feed-entry-progress{margin:14px 0 4px;}
  .feed-entry-progress .est-row{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:7px;}
  .feed-entry-progress .pct-row{display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:800; margin-top:7px;}
  .feed-entry-progress .pct-row .pct{color:var(--ink);}
  .feed-entry-progress .pct-row .pages{color:var(--ink);}
  .feed-entry-book{
    display:flex; align-items:center; gap:12px; margin-top:14px;
    background:var(--paper); border-radius:var(--radius-md); padding:10px;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .feed-entry-book:active{transform:scale(.98);}
  .feed-entry-book .meta{min-width:0; flex:1; order:1;}
  .feed-entry-book .thumb{width:64px; height:90px; border-radius:9px; overflow:hidden; flex-shrink:0; order:2;}
  .feed-entry-book .meta p:first-child{font-size:14px; font-weight:800; line-height:1.3; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .feed-entry-book .meta p:last-child{font-size:12px; color:var(--ink-soft); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- Insight carousel (início) ---------- */
  .inicio-hero{
    background:var(--brand);
    margin:-18px -20px 0; padding:14px 20px 18px;
  }
  .insight-row{
    display:flex; gap:12px; overflow-x:auto;
    margin:0; padding:2px 0 4px;
    scroll-snap-type:x proximity;
  }
  .insight-row::-webkit-scrollbar{display:none;}
  .insight-card{
    flex:0 0 auto; width:196px; scroll-snap-align:start;

    box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:9px;

  }
  .insight-card .ins-title{font-size:13px; font-weight:800; line-height:1.25;}
  .insight-card .ins-sub{color:var(--ink-soft); font-size:11.5px; line-height:1.4;}
  .insight-card .ins-num{font-size:27px; font-weight:800; margin:1px 0 -2px;}
  .insight-card .ins-book{display:flex; align-items:center; gap:8px;}
  .insight-card .ins-book .thumb{width:32px; height:46px; border-radius:7px; overflow:hidden; flex-shrink:0;}
  .insight-card .ins-book .title{font-size:11.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .insight-card .ins-cta{
    margin-top:auto; align-self:flex-start;
    background:var(--brand); color:var(--paper);
    border-radius:999px; padding:8px 16px; font-size:12.5px; font-weight:800;
  }
  .insight-card .progress-track{background:var(--surface-strong);}
  .insight-card .progress-fill{background:var(--brand);}

  .insight-card.week-card{width:236px;}
  .week-strip{display:flex; gap:4px; justify-content:space-between;}
  .week-day{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .week-day .dot{
    width:22px; height:22px; border-radius:50%; background:var(--surface-strong);
    display:flex; align-items:center; justify-content:center; color:var(--paper);
    transition:background .2s var(--ease), color .2s var(--ease);

  .week-day.active .dot{background:var(--brand);}

  /* ---------- Book detail ---------- */
  .detail-head{display:flex; gap:14px; margin-bottom:16px;}
  .detail-cover{width:104px; height:148px; border-radius:16px; overflow:hidden; flex-shrink:0; box-shadow:0 6px 16px rgba(38,60,32,0.15);}
  .detail-info{display:flex; flex-direction:column; gap:7px; min-width:0; flex:1;}
  .detail-info h1{font-size:17px; line-height:1.3;}
  .detail-info .author{font-size:13.5px; color:var(--ink-soft);}
  .detail-info .pages{font-size:11.5px; color:var(--ink-faint);}

  .status-menu-wrap{position:relative; display:inline-block;}
  .status-menu-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; z-index:15;
    background:var(--paper); border-radius:var(--radius-sm);
    box-shadow:var(--shadow-md);
    width:170px; overflow:hidden; display:none;
  }
  .status-menu-dropdown.open{display:block;}
  .status-menu-dropdown button{
    display:block; width:100%; text-align:left; padding:11px 14px;
    border:none; background:none; font-size:13.5px; color:var(--ink);
  }
  .status-menu-dropdown button:hover{background:var(--sage-soft);}
  .status-menu-dropdown button.current{font-weight:800; color:var(--brand);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    background:rgba(26,43,22,0);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .28s var(--ease), background .28s var(--ease), visibility 0s linear .28s;
  }
  .modal-overlay.open{
    opacity:1; visibility:visible; pointer-events:auto;
    background:rgba(26,43,22,0.45);
    transition:opacity .28s var(--ease), background .28s var(--ease);
  }
  .modal-sheet{
    width:100%; max-width:460px;
    background:var(--paper);
    border-radius:28px 28px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    box-shadow:0 -12px 40px rgba(26,43,22,.18);
    transform:translateY(28px);
    transition:transform .32s var(--ease);
  }
  .modal-overlay.open .modal-sheet{ transform:translateY(0); }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-head h3{font-size:17px;}

  .result-card{
    display:flex; gap:11px; align-items:center;
    padding:9px; border-radius:var(--radius-md);
    background:var(--surface); margin-bottom:9px;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .result-card .thumb{width:40px; height:56px; border-radius:8px; overflow:hidden; flex-shrink:0; background:var(--sage-soft);}
  .result-card .meta{flex:1; min-width:0;}
  .result-card .meta p:first-child{font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .result-card .meta p:last-child{font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- Registrar leitura (página dedicada) ---------- */

  .registro-header h1{flex:1; text-align:center; font-size:16px; margin-right:34px;}
  .registro-book-tag{

  .registro-book-tag .meta{min-width:0;}
  .registro-book-tag .meta p:first-child{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .registro-book-tag .meta p:last-child{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rl-textarea{min-height:190px;}
  .section-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:12px;}
  .rl-hint{font-size:12.5px; color:var(--ink-soft); margin-top:9px;}
  .rl-reaction-row{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--surface); border-radius:var(--radius-md); padding:12px 14px; margin:14px 0;

  .bar-row .bar-track{flex:1; height:9px; border-radius:999px; background:var(--sage-soft); overflow:hidden;}
  .bar-row .bar-fill{height:100%; background:var(--brand); border-radius:999px;}
  .bar-row .bar-val{width:22px; text-align:right; font-size:12px; font-weight:800; flex-shrink:0;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--brand-dark); color:var(--paper);
    padding:11px 18px; border-radius:999px; font-size:13px; font-weight:700;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);

  .search-loading, .search-empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:24px 10px;}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== AUTH SCREEN ===================== -->
  <div id="auth-screen">
    <div class="auth-logo"><span class="msym" style="font-size:28px">auto_stories</span></div>
    <h1 class="auth-title" id="auth-title">Bem-vindo de volta</h1>
    <p class="auth-sub" id="auth-sub">Entre para continuar de onde parou na sua estante.</p>

    <div class="auth-card">
      <div id="auth-error"></div>
      <form id="login-form" onsubmit="return Auth.handleLogin(event)">
        <div class="field">
          <label>Usuário</label>
          <input type="text" id="login-username" required autocomplete="username" placeholder="seu usuário">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••" inputmode="numeric" pattern="\d{4}" maxlength="4" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4);">
        </div>
        <button class="btn" type="submit" id="login-submit">
          <span class="msym" style="font-size:16px">login</span> Entrar
        </button>
      </form>

      <form id="signup-form" style="display:none;" onsubmit="return Auth.handleSignup(event)">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="signup-name" required autocomplete="name" placeholder="Como podemos te chamar?">
        </div>
        <div class="field">
          <label>Usuário</label>
          <input type="text" id="signup-username" required autocomplete="username" placeholder="escolha um usuário">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="signup-password" required minlength="4" maxlength="4" autocomplete="new-password" placeholder="4 dígitos" inputmode="numeric" pattern="\d{4}" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4);">
        </div>
        <button class="btn" type="submit" id="signup-submit">
          <span class="msym" style="font-size:16px">person_add</span> Criar minha conta
        </button>
      </form>
    </div>

    <p class="auth-switch" id="auth-switch">
      Ainda não tem conta? <button type="button" onclick="Auth.toggleMode()">Criar conta</button>
    </p>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell">
    <header class="topbar">
      <div class="topbar-side">
        <div class="avatar" id="topbar-avatar">–</div>
      </div>
      <div class="brand-mark">
        <span>Booky</span>
      </div>
      <div class="topbar-side"></div>
    </header>

    <main class="view" id="view-container"></main>

    <nav class="bottomnav">
      <button class="nav-item" data-nav="inicio" onclick="Router.go('inicio')">
        <span class="nav-ico"><span class="msym" style="font-size:19px">home</span></span>

    </nav>
  </div>

</div>

<!-- ===================== MODALS ===================== -->
<div class="modal-overlay" id="modal-book-picker" onclick="if(event.target===this) Modals.close('modal-book-picker')">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3>Escolha o livro</h3>

</div>

<div class="modal-overlay" id="modal-search-add" onclick="if(event.target===this) Modals.close('modal-search-add')">

      <h3>Adicionar à estante</h3>

    <div class="field">

<div class="modal-overlay" id="modal-edit-entry" onclick="if(event.target===this) Modals.close('modal-edit-entry')">

    <div class="modal-head">
      <h3>Editar registro</h3>
      <button class="icon-btn" onclick="Modals.close('modal-edit-entry')"><span class="msym" style="font-size:18px">close</span></button>

      <div class="field">

      <button class="btn btn-ghost" style="width:auto; flex:1;" onclick="Modals.close('modal-confirm')">Cancelar</button>

    </div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ICONS (Material Symbols via Google Fonts)
========================================================= */
function icon(name, size, filled){
  return `<span class="msym${filled ? ' filled' : ''}" style="font-size:${size}px">${name}</span>`;
}

function renderIcons(){ /* mantido por compatibilidade; a fonte renderiza sozinha */ }

/* =========================================================
   STORAGE
========================================================= */
const StorageKeys = {
  users: 'booky_users_v1',
  session: 'booky_session_v1',
  data: (uid) => `booky_data_v1_${uid}`,
};

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* =========================================================
   AUTH
========================================================= */
const Auth = {
  mode: 'login',

  toggleMode(){
    this.mode = this.mode === 'login' ? 'signup' : 'login';
    const isLogin = this.mode === 'login';
    document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
    document.getElementById('signup-form').style.display = isLogin ? 'none' : 'block';
    document.getElementById('auth-title').textContent = isLogin ? 'Bem-vindo de volta' : 'Crie sua conta';
    document.getElementById('auth-sub').textContent = isLogin
      ? 'Entre para continuar de onde parou na sua estante.'
      : 'Um login só seu, para guardar suas leituras e seu progresso.';
    document.getElementById('auth-switch').innerHTML = isLogin
      ? 'Ainda não tem conta? <button type="button" onclick="Auth.toggleMode()">Criar conta</button>'
      : 'Já tem conta? <button type="button" onclick="Auth.toggleMode()">Entrar</button>';
    document.getElementById('auth-error').innerHTML = '';
  },

  showError(msg){
    document.getElementById('auth-error').innerHTML = `<div class="form-error">${escapeHtml(msg)}</div>`;
  },

  getUsers(){ return loadJSON(StorageKeys.users, []); },
  saveUsers(users){ saveJSON(StorageKeys.users, users); },

  async handleSignup(e){
    e.preventDefault();
    document.getElementById('auth-error').innerHTML = '';
    const name = document.getElementById('signup-name').value.trim();
    const username = document.getElementById('signup-username').value.trim().toLowerCase();
    const password = document.getElementById('signup-password').value;

    if(!name || !username){
      this.showError('Preencha todos os campos.');
      return false;
    }
    if(!/^\d{4}$/.test(password)){
      this.showError('A senha precisa ter exatamente 4 dígitos.');
      return false;
    }

    const users = this.getUsers();
    if(users.some(u => u.username === username)){
      this.showError('Já existe uma conta com esse usuário.');
      return false;
    }

    const btn = document.getElementById('signup-submit');
    btn.disabled = true; btn.textContent = 'Criando conta...';

    const passwordHash = await sha256(password);
    const user = { id: uid(), name, username, passwordHash, createdAt: Date.now() };
    users.push(user);
    this.saveUsers(users);
    saveJSON(StorageKeys.data(user.id), { books: [], entries: [] });
    saveJSON(StorageKeys.session, { userId: user.id });

    App.boot();
    return false;
  },

  async handleLogin(e){
    e.preventDefault();
    document.getElementById('auth-error').innerHTML = '';
    const username = document.getElementById('login-username').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;

    const btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = 'Entrando...';

    const users = this.getUsers();
    const user = users.find(u => u.username === username);
    const hash = await sha256(password);

    btn.disabled = false; btn.innerHTML = `${icon('login', 16)} Entrar`;
    renderIcons();

    if(!user || user.passwordHash !== hash){
      this.showError('Usuário ou senha incorretos.');
      return false;
    }

    saveJSON(StorageKeys.session, { userId: user.id });
    App.boot();
    return false;
  },

  getSession(){ return loadJSON(StorageKeys.session, null); },

  currentUser(){
    const session = this.getSession();
    if(!session) return null;
    const users = this.getUsers();
    return users.find(u => u.id === session.userId) || null;
  },

  logout(){
    localStorage.removeItem(StorageKeys.session);
    this.mode = 'login';
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    if(loginForm && signupForm){
      loginForm.reset();
      signupForm.reset();
      loginForm.style.display = 'block';
      signupForm.style.display = 'none';
      document.getElementById('auth-title').textContent = 'Bem-vindo de volta';
      document.getElementById('auth-sub').textContent = 'Entre para continuar de onde parou na sua estante.';
      document.getElementById('auth-switch').innerHTML = 'Ainda não tem conta? <button type="button" onclick="Auth.toggleMode()">Criar conta</button>';
      document.getElementById('auth-error').innerHTML = '';
      const loginBtn = document.getElementById('login-submit');
      loginBtn.disabled = false; loginBtn.innerHTML = `${icon('login', 16)} Entrar`;
      const signupBtn = document.getElementById('signup-submit');
      signupBtn.disabled = false; signupBtn.innerHTML = `${icon('person_add', 16)} Criar minha conta`;
      renderIcons();
    }
    App.boot();
  },
};

/* =========================================================
   DATA (per-user)
========================================================= */
const Data = {
  get(){
    const user = Auth.currentUser();

const Router = {
  current: { view:'inicio', params:{} },

  go(view, params={}){
    location.hash = params.id ? `/${view}/${params.id}` : `/${view}`;
  },

  parseHash(){
    const raw = location.hash.replace(/^#\/?/, '');
    const [view, id] = raw.split('/');
    return { view: view || 'inicio', params: id ? { id } : {} };
  },

  onHashChange(){
    if(!Auth.currentUser()) return;
    this.current = this.parseHash();
    View.render(this.current.view, this.current.params);
  },

  init(){
    window.addEventListener('hashchange', () => this.onHashChange());
  },
};

/* =========================================================

========================================================= */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const dateFmt = new Intl.DateTimeFormat('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
function formatDate(ts){ return dateFmt.format(new Date(ts)); }

function initials(name){
  return (name || '').trim().split(/\s+/).slice(0,2).map(p => p[0]?.toUpperCase() || '').join('');
}

async function fetchWithTimeout(url, ms=9000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, { signal: controller.signal });
  }finally{
    clearTimeout(timer);
  }
}

function googleBooksCover(info, highQuality=false){
  const links = info.imageLinks;
  if(!links) return null;
  const src = (highQuality && links.thumbnail) ? links.thumbnail : (links.thumbnail || links.smallThumbnail);
  if(!src) return null;
  return src.replace('http://', 'https://').replace('&edge=curl', '').replace('zoom=1', 'zoom=2');
}

function bookCoverHtml(book, extraClass=''){
  if(book.cover){
    return `<div class="book-cover ${extraClass}"><img src="${escapeHtml(book.cover)}" alt="Capa de ${escapeHtml(book.title)}" loading="lazy"></div>`;
  }
  return `<div class="book-cover ${extraClass}"><span>${escapeHtml(book.title)}</span></div>`;
}

function starsHtml(rating, interactive, bookId){
  let html = '<div class="stars">';
  for(let i=1;i<=5;i++){
    const filled = rating && i <= rating ? 'filled' : '';
    const onclick = interactive ? `onclick="Books.rate('${bookId}', ${i})"` : '';
    html += `<button type="button" class="star-btn ${filled}" ${onclick} ${interactive ? '' : 'disabled'}>
      ${icon('star', 24, !!filled)}
    </button>`;
  }
  html += '</div>';
  return html;
}

const ASSUMED_MIN_PER_PAGE = 1.6; // estimativa de ritmo de leitura, usada só para o rótulo de tempo do card

function formatDuration(minutes){
  const m = Math.max(0, Math.round(minutes));
  const h = Math.floor(m / 60);
  const mm = m % 60;
  if(h <= 0) return `${mm}m`;
  return `${h}h ${String(mm).padStart(2,'0')}m`;
}

function registroHintText(book, mode, value){
  const num = Number(value) || 0;
  if(!book.totalPages){
    return `${Math.min(100, Math.max(0, num))}% concluído`;
  }
  if(mode === 'paginas'){
    const page = Math.min(book.totalPages, Math.max(0, num));
    const pct = Math.round((page / book.totalPages) * 100);
    return `${page} de ${book.totalPages} páginas · ${pct}%`;
  }
  const pct = Math.min(100, Math.max(0, num));
  const page = Math.round((pct / 100) * book.totalPages);
  return `${pct}% · ${page} de ${book.totalPages} páginas`;
}

function weekStripHtml(){
  const { entries } = Data.get();
  const daysWithEntry = new Set(entries.map(e => {
    const d = new Date(e.createdAt);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }));
  const labels = ['D','S','T','Q','Q','S','S'];
  const today = new Date();
  let html = '';
  for(let i = 6; i >= 0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const active = daysWithEntry.has(key);
    html += `
      <div class="week-day ${active ? 'active' : ''} ${i === 0 ? 'today' : ''}">
        <div class="dot">${active ? icon('check', 13) : ''}</div>
        <span>${labels[d.getDay()]}</span>
      </div>
    `;
  }
  return html;
}

function renderFeedEntry(entry, book, index=0){
  if(!book) return '';
  const isQuote = entry.type === 'quote';
  const user = Auth.currentUser();
  const actionLabel = isQuote ? 'Postou uma citação' : 'Fez um registro de leitura';

  let progressBlock = '';
  if(!isQuote && entry.progress != null){
    if(book.totalPages){
      const currentPage = Math.round((entry.progress / 100) * book.totalPages);
      const remainingPages = Math.max(0, book.totalPages - currentPage);
      progressBlock = `
        <div class="feed-entry-progress">
          <div class="est-row">
            <span>${formatDuration(currentPage * ASSUMED_MIN_PER_PAGE)}</span>
            <span>${formatDuration(remainingPages * ASSUMED_MIN_PER_PAGE)}</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, entry.progress)}%"></div></div>
          <div class="pct-row">
            <span class="pct">${entry.progress}%</span>
            <span class="pages">${currentPage} de ${book.totalPages}</span>
          </div>
        </div>
      `;
    }else{
      progressBlock = `
        <div class="feed-entry-progress">
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, entry.progress)}%"></div></div>
          <div class="pct-row"><span class="pct">${entry.progress}% concluído</span></div>

  return `

function computeStats(){
  const { books, entries } = Data.get();
  const read = books.filter(b => b.status === 'lido');
  const ratings = read.filter(b => b.rating).map(b => b.rating);
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length) : null;

  const monthsWithFinish = new Set(
    read.filter(b => b.finishedAt).map(b => {
      const d = new Date(b.finishedAt);
      return `${d.getFullYear()}-${d.getMonth()}`;
    })
  );
  let streak = 0;
  const cursor = new Date();
  while(true){
    const key = `${cursor.getFullYear()}-${cursor.getMonth()}`;
    if(monthsWithFinish.has(key)){ streak++; cursor.setMonth(cursor.getMonth()-1); }
    else break;
  }

  const now = new Date();
  const readThisYear = read.filter(b => b.finishedAt && new Date(b.finishedAt).getFullYear() === now.getFullYear()).length;

  const byYear = new Map();
  read.forEach(b => {
    if(!b.finishedAt) return;
    const y = new Date(b.finishedAt).getFullYear();
    byYear.set(y, (byYear.get(y) || 0) + 1);
  });
  const byYearArr = [...byYear.entries()].sort((a,b) => b[0]-a[0]);

  const ratingDist = [1,2,3,4,5].map(n => read.filter(b => b.rating === n).length);
  const totalPages = read.reduce((sum,b) => sum + (b.totalPages || 0), 0);
  const quotesCount = entries.filter(e => e.type === 'quote').length;

  // --- sequência diária (dias seguidos com pelo menos um registro) ---
  const daysWithEntry = new Set(entries.map(e => {
    const d = new Date(e.createdAt);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }));
  let dailyStreak = 0;
  const dayCursor = new Date();
  while(true){
    const key = `${dayCursor.getFullYear()}-${dayCursor.getMonth()}-${dayCursor.getDate()}`;
    if(daysWithEntry.has(key)){ dailyStreak++; dayCursor.setDate(dayCursor.getDate() - 1); }
    else break;
  }

  // --- última reação registrada ---
  const logEntries = [...entries].filter(e => e.type === 'log' && e.mood).sort((a,b) => b.createdAt - a.createdAt);
  let lastMood = null;
  if(logEntries.length){
    const key = logEntries[0].mood;
    const meta = MOODS.find(m => m.key === key);
    const count = logEntries.filter(e => e.mood === key).length;
    lastMood = { icon: meta ? meta.icon : 'sentiment_neutral', label: meta ? meta.label : 'Neutro', count };
  }

  // --- ritmo de páginas ---
  const oneDay = 86400000;
  const sevenDaysAgo = now.getTime() - 7 * oneDay;
  const pagesLast7Days = read
    .filter(b => b.finishedAt && b.finishedAt >= sevenDaysAgo)
    .reduce((sum,b) => sum + (b.totalPages || 0), 0);

  const firstActivity = Math.min(
    ...books.map(b => b.createdAt),
    ...entries.map(e => e.createdAt),
    now.getTime()
  );
  const daysSinceStart = Math.max(1, Math.round((now.getTime() - firstActivity) / oneDay));
  const pagesPerDay = totalPages / daysSinceStart;

  const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();
  const daysThisYear = Math.max(1, Math.round((now.getTime() - startOfYear) / oneDay));
  const pagesThisYear = read
    .filter(b => b.finishedAt && new Date(b.finishedAt).getFullYear() === now.getFullYear())
    .reduce((sum,b) => sum + (b.totalPages || 0), 0);
  const pagesPerDayThisYear = pagesThisYear / daysThisYear;

  // --- avaliações e resenhas ---
  const ratedCount = ratings.length;
  const reviewedBookIds = new Set(entries.filter(e => e.type === 'log' && e.text).map(e => e.bookId));
  const reviewedCount = read.filter(b => reviewedBookIds.has(b.id)).length;

  const readByRecent = [...read].sort((a,b) => (b.finishedAt||0) - (a.finishedAt||0));
  const unratedFinished = readByRecent.find(b => !b.rating) || null;
  const unreviewedFinished = readByRecent.find(b => !reviewedBookIds.has(b.id)) || null;

  return {
    totalBooks: books.length, totalRead: read.length, readThisYear, avgRating, streak, byYear: byYearArr,
    ratingDist, totalPages, quotesCount, dailyStreak, lastMood, pagesLast7Days, pagesPerDay, pagesThisYear,
    pagesPerDayThisYear, ratedCount, reviewedCount, unratedFinished, unreviewedFinished,
  };
}

const View = {
  _lastView: null,

  render(view, params){
    document.querySelectorAll('.nav-item[data-nav]').forEach(el => {
      el.classList.toggle('active', el.dataset.nav === (view === 'livro' ? 'estante' : (['perfil','estatisticas','configuracoes'].includes(view) ? 'menu' : view)));
    });

    const apply = () => {
      const container = document.getElementById('view-container');
      let html = '';
      switch(view){
        case 'inicio': html = Views.inicio(); break;
        case 'estante': html = Views.estante(); break;
        case 'busca': html = Views.busca(); break;
        case 'menu': html = Views.menu(); break;
        case 'perfil': html = Views.perfil(); break;
        case 'estatisticas': html = Views.estatisticas(); break;
        case 'configuracoes': html = Views.configuracoes(); break;
        case 'livro': html = Views.livro(params.id); break;
        case 'registro': html = Views.registro(params.id); break;
        default: html = Views.inicio();
      }
      container.innerHTML = html;

      const avatar = document.getElementById('topbar-avatar');
      const user = Auth.currentUser();
      if(user) avatar.textContent = initials(user.name);

      const topbar = document.querySelector('header.topbar');
      const brandMark = document.querySelector('.brand-mark');
      const avatarSlot = document.querySelector('.topbar-side:first-child');
      const hideHeader = ['inicio', 'busca', 'menu'].includes(view);
      topbar.style.display = hideHeader ? 'none' : '';
      if(!hideHeader){
        // visibility (not display) keeps both items in their grid track, so
        // the brand-mark stays centered instead of sliding into the hidden
        // item's column when the avatar (or brand) is toggled off.
        brandMark.style.visibility = view === 'estante' ? 'visible' : 'hidden';
        avatarSlot.style.visibility = view === 'estante' ? 'hidden' : 'visible';
      }
    };

    // A transição animada (cross-fade) só entra em navegações reais entre abas.
    // document.startViewTransition() adia a execução do callback de forma
    // assíncrona — usar isso também para re-renderizações dentro da mesma view
    // (avaliar, mudar status, publicar registro) cria uma janela onde a UI
    // antiga ainda está no DOM, podendo perder interações em andamento.
    const isNavigation = view !== this._lastView;
    this._lastView = view;

    if(isNavigation && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.startViewTransition(apply);
    }else{
      apply();
    }

    if(view === 'busca') Search.init();
  },
};

      <button type="button" class="fab-registro" onclick="QuickActions.registrarLeitura()" aria-label="Registrar leitura">
        ${icon('add', 26)}
      </button>
    `;
  },

  estante(state = {}){
    const { books } = Data.get();
    const filter = state.filter || Views._estanteFilter || 'todos';
    const query = (state.query ?? Views._estanteQuery ?? '').toLowerCase();
    const searchOpen = !!Views._estanteSearchOpen;
    Views._estanteFilter = filter;
    Views._estanteQuery = query;

    let filtered = books;
    if(filter === 'favoritos') filtered = filtered.filter(b => b.favorito);
    else if(filter === 'tem_em_casa') filtered = filtered.filter(b => b.temEmCasa);
    else if(filter !== 'todos') filtered = filtered.filter(b => b.status === filter);
    if(query) filtered = filtered.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));
    filtered = [...filtered].sort((a,b) => b.updatedAt - a.updatedAt);

    const activeFilter = ESTANTE_FILTERS.find(f => f.key === filter) || ESTANTE_FILTERS[0];
    const totalPages = books.filter(b => b.status === 'lido').reduce((sum,b) => sum + (b.totalPages || 0), 0);

    const grid = filtered.length ? `<div class="book-grid">${filtered.map(b => `
      <a class="book-card card-tap" href="#/livro/${b.id}">
        <div class="book-ribbon" style="--ribbon-color:var(--tag-${b.status});"></div>
        ${bookCoverHtml(b)}
        <div class="book-info">
          <div class="bi-badges">
            <span class="bi-pct">${b.progress || 0}%</span>
            ${b.rating ? `<span class="bi-rating">${icon('star', 12)}${b.rating}</span>` : ''}
          </div>
          <button type="button" class="book-card-menu-btn" onclick="Books.toggleCardMenu(event,'${b.id}')" aria-label="Mais opções">
            ${icon('more_horiz', 16)}
          </button>
          <div class="book-card-menu" id="card-menu-${b.id}">
            <button type="button" onclick="event.preventDefault(); event.stopPropagation(); Books.toggleFavorito('${b.id}')">
              ${icon('favorite', 15)} ${b.favorito ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}
            </button>
            <button type="button" onclick="event.preventDefault(); event.stopPropagation(); Books.toggleTemEmCasa('${b.id}')">
              ${icon('home', 15)} ${b.temEmCasa ? 'Remover "tenho em casa"' : 'Marcar "tenho em casa"'}
            </button>
            <button type="button" class="danger" onclick="event.preventDefault(); event.stopPropagation(); Books.confirmDelete('${b.id}')">
              ${icon('delete', 15)} Remover livro
            </button>
          </div>
        </div>
      </a>
    `).join('')}</div>` : `<div class="empty-note">Nenhum livro encontrado por aqui.</div>`;

    return `
      <div class="estante-top">
        <div class="estante-header-card">
          <p class="eh-title">${escapeHtml(activeFilter.label)}</p>
          <div class="eh-pagi">
            <p class="eh-pagi-label">Paginômetro</p>
            <p class="eh-pagi-num">${totalPages.toLocaleString('pt-BR')}</p>
          </div>
        </div>
        <button type="button" class="estante-search-btn ${searchOpen ? 'active' : ''}" onclick="Views.toggleEstanteSearch()" aria-label="Buscar na estante">
          ${icon('search', 20)}
        </button>
      </div>

      ${searchOpen ? `
        <div class="search-box">
          ${icon('search', 16)}
          <input type="search" placeholder="Buscar por título ou autor(a)" value="${escapeHtml(query)}" oninput="Views.estanteSearch(this.value)" autofocus>
        </div>
      ` : ''}

      <div class="estante-filter-row">
        ${ESTANTE_FILTERS.map(f => `
          <button type="button" class="estante-chip ${filter===f.key?'active':''}" style="--chip-color:${f.color};" onclick="Views.estanteFilter('${f.key}')">
            ${icon(f.icon, 20)}
            <span class="label">${f.label}</span>
          </button>
        `).join('')}
      </div>

      <p class="estante-count">${filtered.length} ${filtered.length === 1 ? 'item encontrado' : 'itens encontrados'}</p>

      ${grid}
    `;
  },

  toggleEstanteSearch(){
    Views._estanteSearchOpen = !Views._estanteSearchOpen;
    if(!Views._estanteSearchOpen) Views._estanteQuery = '';
    document.getElementById('view-container').innerHTML = Views.estante({});
    if(Views._estanteSearchOpen){
      const input = document.querySelector('.search-box input');
      if(input) input.focus();
    }
  },

  estanteFilter(key){
    Views._estanteFilter = key;
    document.getElementById('view-container').innerHTML = Views.estante({ filter:key, query: Views._estanteQuery });
    const active = document.querySelector('.estante-chip.active');
    if(active) active.scrollIntoView({ behavior:'smooth', inline:'nearest', block:'nearest' });
  },
  estanteSearch(value){
    Views._estanteQuery = value;
    clearTimeout(Views._estSearchT);

      const container = document.getElementById('view-container');
      container.innerHTML = Views.estante({ filter: Views._estanteFilter, query: value });

      if(input){ input.focus(); input.setSelectionRange(value.length, value.length); }

  busca(){

  estatisticas(){
    const stats = computeStats();
    const maxYear = stats.byYear.length ? Math.max(...stats.byYear.map(([,c]) => c)) : 1;
    const maxRating = Math.max(1, ...stats.ratingDist);

    const yearBars = stats.byYear.length ? stats.byYear.map(([year,count]) => `
      <div class="bar-row">
        <span class="bar-label">${year}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(count/maxYear)*100}%"></div></div>
        <span class="bar-val">${count}</span>
      </div>
    `).join('') : `<p style="font-size:13px; color:var(--ink-soft);">Ainda sem livros concluídos.</p>`;

    const ratingBars = [5,4,3,2,1].map(n => `
      <div class="bar-row">
        <span class="bar-label">${n} ★</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(stats.ratingDist[n-1]/maxRating)*100}%"></div></div>
        <span class="bar-val">${stats.ratingDist[n-1]}</span>
      </div>
    `).join('');

    return `
      <h1 class="page-title" style="margin-bottom:18px;">Estatísticas</h1>

      <div class="stat-grid cols-2" style="margin-bottom:22px;">

        <div class="stat-box"><div class="num">${stats.streak}</div><div class="lbl">meses seguidos lendo</div></div>
        <div class="stat-box"><div class="num">${stats.avgRating ? stats.avgRating.toFixed(1) : '–'}</div><div class="lbl">nota média dada</div></div>

      <div class="card">${yearBars}</div>

      <h2 class="section-title">Dados</h2>
      <button class="btn btn-ghost btn-sm" style="width:100%; margin-bottom:8px; justify-content:flex-start; gap:10px;" onclick="Settings.exportData()">
        ${icon('download', 16)} Exportar meus dados (JSON)
      </button>
      <button class="btn btn-ghost btn-sm" style="width:100%; margin-bottom:22px; justify-content:flex-start; gap:10px; color:var(--danger); border-color:var(--danger-soft);" onclick="Settings.confirmClearData()">
        ${icon('delete', 16)} Apagar todos os livros
      </button>

      <button class="btn btn-danger btn-sm" style="width:100%;" onclick="Auth.logout()">
        ${icon('power_settings_new', 16)} Sair da conta
      </button>
    `;
  },

  livro(id){
    const book = Data.getBook(id);
    if(!book){
      return `<div class="empty-note">Livro não encontrado. <br><br><button class="btn btn-sm" onclick="Router.go('estante')">Voltar para a estante</button></div>`;
    }
    const { entries } = Data.get();
    const bookEntries = entries.filter(e => e.bookId === book.id).sort((a,b) => b.createdAt - a.createdAt);

    const historyHtml = bookEntries.length
      ? bookEntries.map((e, i) => renderFeedEntry(e, book, i)).join('')
      : `<div class="empty-note">Nenhum registro ainda. Conte como está a leitura!</div>`;

    return `
      <button onclick="Router.go('estante')" style="background:none; border:none; display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13.5px; font-weight:700; padding:0; margin-bottom:16px;">
        ${icon('arrow_back', 16)} Voltar para a estante
      </button>

      <div class="detail-head">
        <div class="detail-cover">${bookCoverHtml(book)}</div>
        <div class="detail-info">
          <h1>${escapeHtml(book.title)}</h1>
          <p class="author">${escapeHtml(book.author)}</p>
          ${book.totalPages ? `<p class="pages">${book.totalPages} páginas</p>` : ''}
          <div class="status-menu-wrap">
            <button class="status-pill status-${book.status}" style="display:inline-flex; align-items:center; gap:4px;" onclick="Books.toggleStatusMenu(event)">

            </button>

            <span>Progresso</span><span>${book.progress||0}%</span>
          </div>

        <p style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:10px;">Sua avaliação</p>
        ${starsHtml(book.rating, true, book.id)}
      </div>

      <button type="button" class="btn" style="margin-bottom:22px; display:flex; align-items:center; justify-content:center; gap:8px;" onclick="Router.go('registro',{id:'${book.id}'})">
        ${icon('edit_note', 18)} Registrar leitura
      </button>

      <h2 class="section-title">Histórico de leitura</h2>

      <div style="text-align:center; margin-top:22px;">
        <button style="background:none; border:none; color:var(--danger); font-size:12.5px; font-weight:700;" onclick="Books.confirmDelete('${book.id}')">

        </button>
      </div>
