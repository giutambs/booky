  },

  registro(bookId){
    const book = Data.getBook(bookId);
    if(!book){
      return `<div class="empty-note">Livro não encontrado. <br><br><button class="btn btn-sm" onclick="Router.go('estante')">Voltar para a estante</button></div>`;
    }

    if(Views._registroBookId !== bookId){
      Views._registroBookId = bookId;
      Views._entryType = 'log';
      Views._progressMode = null;
      Views._registroMood = null;
    }

    const entryType = Views._entryType || 'log';
    const hasPages = !!book.totalPages;
    let mode = Views._progressMode || (hasPages ? 'paginas' : 'porcentagem');
    if(!hasPages) mode = 'porcentagem';
    Views._progressMode = mode;

    const currentPercent = book.progress || 0;
    const currentPage = hasPages ? Math.round((currentPercent / 100) * book.totalPages) : null;
    const defaultValue = mode === 'paginas' ? (currentPage ?? '') : currentPercent;

    const moodMeta = MOODS.find(m => m.key === Views._registroMood);

    return `
      <div class="registro-header">
        <button type="button" class="icon-btn" onclick="Router.go('livro',{id:'${book.id}'})" aria-label="Voltar">
          ${icon('arrow_back', 20)}
        </button>
        <h1>Histórico de leitura</h1>
      </div>

      <a href="#/livro/${book.id}" class="registro-book-tag card-tap">
        <div class="thumb">${bookCoverHtml(book)}</div>
        <div class="meta">
          <p>${escapeHtml(book.title)}</p>
          <p>${escapeHtml(book.author)}</p>
        </div>
      </a>

      <div class="type-toggle" id="rl-type-toggle">
        <button type="button" data-type="log" class="${entryType==='log'?'active':''}" onclick="Books.setEntryType('log')">${icon('rate_review', 14)} Anotação</button>
        <button type="button" data-type="quote" class="${entryType==='quote'?'active':''}" onclick="Books.setEntryType('quote')">${icon('format_quote', 14)} Citação</button>
      </div>

      <form onsubmit="return Books.publishRegistro(event, '${book.id}')">
        <div class="field" style="margin-top:14px;">
          <textarea id="rl-text" class="rl-textarea" placeholder="${entryType==='quote' ? 'Digite a citação...' : 'Escreva suas impressões (opcional)'}" ${entryType==='quote' ? 'required' : ''}></textarea>
        </div>

        <div id="rl-log-fields" style="display:${entryType==='log' ? 'block' : 'none'};">
          <div class="card" style="margin-top:14px;">
            <p class="section-label">Digite o seu progresso</p>
            <div class="type-toggle" id="rl-progress-toggle" style="margin-bottom:12px;">
              <button type="button" data-mode="paginas" class="${mode==='paginas'?'active':''}" ${!hasPages ? 'disabled' : ''} onclick="Books.setProgressMode('paginas')">Páginas</button>
              <button type="button" data-mode="porcentagem" class="${mode==='porcentagem'?'active':''}" onclick="Books.setProgressMode('porcentagem')">Porcentagem</button>
            </div>
            <div class="field" style="margin-bottom:0;">
              <input type="number" id="rl-progress-value" min="0" max="${mode==='paginas' ? (book.totalPages||99999) : 100}" inputmode="numeric"
                value="${defaultValue}" placeholder="${mode==='paginas' ? 'Ex: 94' : 'Ex: 40'}"
                oninput="Books.updateProgressHint('${book.id}')">
            </div>
            <p class="rl-hint" id="rl-progress-hint">${registroHintText(book, mode, defaultValue)}</p>
          </div>

          <button type="button" class="rl-reaction-row" onclick="Books.toggleReactionPicker()">
            <span class="rl-reaction-icon">${moodMeta ? icon(moodMeta.icon, 18) : icon('mood', 18)}</span>
            <span class="rl-reaction-label">${moodMeta ? moodMeta.label : 'Adicionar reação'}</span>
          </button>
          <div class="mood-row" id="rl-reaction-picker" style="display:none; margin:-6px 0 16px;">
            ${MOODS.map(m => `<button type="button" class="mood-btn ${Views._registroMood===m.key?'active':''}" data-mood="${m.key}" title="${m.label}" onclick="Books.pickRegistroMood(this,'${m.key}')">${icon(m.icon, 17)}</button>`).join('')}
          </div>
        </div>

        <button class="btn" type="submit" style="margin-top:6px;">Publicar</button>
      </form>
    `;
  },
};

/* =========================================================
   BOOKS
========================================================= */
const Books = {
  add({ title, author, cover=null, totalPages=null, status='quero_ler' }){
    const data = Data.get();
    const now = Date.now();
    const book = {
      id: uid(), title, author, cover, totalPages,
      status, rating: null, progress: status==='lido' ? 100 : 0,
      startedAt: status==='lendo' ? now : null,
      finishedAt: status==='lido' ? now : null,
      favorito: false, temEmCasa: false,
      createdAt: now, updatedAt: now,
    };
    data.books.push(book);
    Data.save(data);
    return book;
  },

  toggleStatusMenu(evt){
    evt.stopPropagation();
    const dd = document.getElementById('status-dropdown');
    dd.classList.toggle('open');
    const closeOnce = (ev) => {
      if(!dd.contains(ev.target)){ dd.classList.remove('open'); document.removeEventListener('click', closeOnce); }
    };
    setTimeout(() => document.addEventListener('click', closeOnce), 0);
  },

  setStatus(bookId, status){
    const data = Data.get();
    const book = data.books.find(b => b.id === bookId);
    if(!book) return;
    book.status = status;
    book.updatedAt = Date.now();
    if(status === 'lendo' && !book.startedAt) book.startedAt = Date.now();
    if(status === 'lido'){ book.finishedAt = Date.now(); book.progress = 100; }
    else if(status !== 'relendo'){ book.finishedAt = null; }
    Data.save(data);
    View.render('livro', { id: bookId });
  },

  toggleFavorito(bookId){
    const data = Data.get();
    const book = data.books.find(b => b.id === bookId);
    if(!book) return;
    book.favorito = !book.favorito;
    Data.save(data);
    document.getElementById('view-container').innerHTML = Views.estante({});
    showToast(book.favorito ? 'Adicionado aos favoritos' : 'Removido dos favoritos');
  },

  toggleTemEmCasa(bookId){
    const data = Data.get();
    const book = data.books.find(b => b.id === bookId);
    if(!book) return;
    book.temEmCasa = !book.temEmCasa;
    Data.save(data);
    document.getElementById('view-container').innerHTML = Views.estante({});
    showToast(book.temEmCasa ? 'Marcado como "tenho em casa"' : 'Removido de "tenho em casa"');
  },

  toggleCardMenu(evt, bookId){
    evt.preventDefault();
    evt.stopPropagation();
    document.querySelectorAll('.book-card-menu.open').forEach(el => {
      if(el.id !== `card-menu-${bookId}`) el.classList.remove('open');
    });
    const menu = document.getElementById(`card-menu-${bookId}`);
    if(!menu) return;
    menu.classList.toggle('open');
    const closeOnce = (ev) => {
      if(!menu.contains(ev.target)){ menu.classList.remove('open'); document.removeEventListener('click', closeOnce); }
    };
    setTimeout(() => document.addEventListener('click', closeOnce), 0);
  },

  rate(bookId, rating){
    const data = Data.get();
    const book = data.books.find(b => b.id === bookId);
    if(!book) return;
    book.rating = rating;
    book.updatedAt = Date.now();
    Data.save(data);
    View.render('livro', { id: bookId });
  },

  setEntryType(type){
    Views._entryType = type;
    document.querySelectorAll('#rl-type-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === type);
    });
    const textarea = document.getElementById('rl-text');
    if(textarea){
      textarea.placeholder = type === 'quote' ? 'Digite a citação...' : 'Escreva suas impressões (opcional)';
      textarea.required = type === 'quote';
    }
    const logFields = document.getElementById('rl-log-fields');
    if(logFields) logFields.style.display = type === 'quote' ? 'none' : 'block';
  },

  setProgressMode(mode){
    const bookId = Router.current.params.id;
    const book = Data.getBook(bookId);
    const prevMode = Views._progressMode || 'porcentagem';
    const input = document.getElementById('rl-progress-value');

    if(input && book && book.totalPages && prevMode !== mode){
      const raw = Number(input.value) || 0;
      if(prevMode === 'paginas' && mode === 'porcentagem'){
        input.value = Math.round((Math.min(book.totalPages, Math.max(0, raw)) / book.totalPages) * 100);
      }else if(prevMode === 'porcentagem' && mode === 'paginas'){
        input.value = Math.round((Math.min(100, Math.max(0, raw)) / 100) * book.totalPages);
      }
    }
    Views._progressMode = mode;

    document.querySelectorAll('#rl-progress-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    if(input){
      input.max = mode === 'paginas' ? (book?.totalPages || 99999) : 100;
      input.placeholder = mode === 'paginas' ? 'Ex: 94' : 'Ex: 40';
    }
    this.updateProgressHint(bookId);
  },

  updateProgressHint(bookId){
    const book = Data.getBook(bookId);
    if(!book) return;
    const mode = Views._progressMode || 'porcentagem';
    const value = document.getElementById('rl-progress-value').value;
    const hint = document.getElementById('rl-progress-hint');
    if(hint) hint.textContent = registroHintText(book, mode, value);
  },

  toggleReactionPicker(){
    const el = document.getElementById('rl-reaction-picker');
    if(el) el.style.display = el.style.display === 'none' ? 'flex' : 'none';
  },

  pickRegistroMood(btn, key){
    Views._registroMood = key;
    document.querySelectorAll('#rl-reaction-picker .mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const meta = MOODS.find(m => m.key === key);
    const row = document.querySelector('.rl-reaction-row');
    if(row && meta){
      row.querySelector('.rl-reaction-icon').innerHTML = icon(meta.icon, 18);
      row.querySelector('.rl-reaction-label').textContent = meta.label;
    }
    const picker = document.getElementById('rl-reaction-picker');
    if(picker) picker.style.display = 'none';
  },

  publishRegistro(e, bookId){
    e.preventDefault();
    const type = Views._entryType || 'log';
    const text = document.getElementById('rl-text').value.trim();
    if(type === 'quote' && !text) return false;

    const data = Data.get();
    const book = data.books.find(b => b.id === bookId);
    const entry = { id: uid(), bookId, type, text, spoiler: false, createdAt: Date.now() };

    if(type === 'log'){
      const mode = Views._progressMode || 'porcentagem';
      const raw = Number(document.getElementById('rl-progress-value').value) || 0;
      let progress;
      if(mode === 'paginas' && book && book.totalPages){
        progress = Math.round((Math.min(book.totalPages, Math.max(0, raw)) / book.totalPages) * 100);
      }else{
        progress = Math.min(100, Math.max(0, raw));
      }
      entry.progress = progress;
      entry.mood = Views._registroMood || 'neutro';

      if(book){
        book.progress = progress;
        book.status = progress >= 100 ? 'lido' : 'lendo';
        if(!book.startedAt) book.startedAt = Date.now();
        book.finishedAt = progress >= 100 ? Date.now() : null;
        book.updatedAt = Date.now();
      }
    }

    data.entries.push(entry);
    Data.save(data);
    Views._entryType = 'log';
    Views._progressMode = null;
    Views._registroMood = null;
    Router.go('livro', { id: bookId });
    showToast(type === 'quote' ? 'Citação publicada' : 'Registro publicado');
    return false;
  },

  confirmDelete(bookId){
    const book = Data.getBook(bookId);
    Modals.confirm({
      title: 'Remover livro',
      message: `Tem certeza que deseja remover "${book.title}" da sua estante? Essa ação não pode ser desfeita.`,
      onConfirm: () => {
        const data = Data.get();
        data.books = data.books.filter(b => b.id !== bookId);
        data.entries = data.entries.filter(e => e.bookId !== bookId);
        Data.save(data);
        Modals.close('modal-confirm');
        Router.go('estante');
        showToast('Livro removido');
      }
    });
  },

  toggleEntryMenu(evt, entryId){
    evt.preventDefault();
    evt.stopPropagation();
    document.querySelectorAll('.feed-entry-menu.open').forEach(el => {
      if(el.id !== `entry-menu-${entryId}`) el.classList.remove('open');
    });
    const menu = document.getElementById(`entry-menu-${entryId}`);
    if(!menu) return;
    menu.classList.toggle('open');
    const closeOnce = (ev) => {
      if(!menu.contains(ev.target)){ menu.classList.remove('open'); document.removeEventListener('click', closeOnce); }
    };
    setTimeout(() => document.addEventListener('click', closeOnce), 0);
  },

  deleteEntry(entryId, bookId){
    Modals.confirm({
      title: 'Excluir registro',
      message: 'Esse registro de leitura será removido permanentemente do seu histórico.',
      onConfirm: () => {
        const data = Data.get();
        data.entries = data.entries.filter(e => e.id !== entryId);
        Data.save(data);
        Modals.close('modal-confirm');
        View.render(Router.current.view, Router.current.params);
        showToast('Registro excluído');
      }
    });
  },

  openEditEntry(entryId){
    document.querySelectorAll('.feed-entry-menu.open').forEach(el => el.classList.remove('open'));
    const { entries } = Data.get();
    const entry = entries.find(e => e.id === entryId);
    if(!entry) return;
    this._editingEntryId = entryId;
    document.getElementById('edit-entry-text').value = entry.text;
    document.getElementById('edit-entry-spoiler').checked = !!entry.spoiler;
    const progressField = document.getElementById('edit-entry-progress-field');
    if(entry.type === 'log'){
      progressField.style.display = 'flex';
      document.getElementById('edit-entry-progress').value = entry.progress ?? 0;
    }else{
      progressField.style.display = 'none';
    }
    Modals.open('modal-edit-entry');
  },

  saveEditEntry(e){
    e.preventDefault();
    const id = this._editingEntryId;
    const data = Data.get();
    const entry = data.entries.find(x => x.id === id);
    if(!entry) return false;

    entry.text = document.getElementById('edit-entry-text').value.trim();
    entry.spoiler = document.getElementById('edit-entry-spoiler').checked;

    if(entry.type === 'log'){
      const progress = Math.min(100, Math.max(0, Number(document.getElementById('edit-entry-progress').value) || 0));
      entry.progress = progress;
      const book = data.books.find(b => b.id === entry.bookId);
      if(book){
        book.progress = progress;
        book.status = progress >= 100 ? 'lido' : 'lendo';
        if(!book.startedAt) book.startedAt = Date.now();
        book.finishedAt = progress >= 100 ? Date.now() : null;
        book.updatedAt = Date.now();
      }
    }

    Data.save(data);
    Modals.close('modal-edit-entry');
    View.render(Router.current.view, Router.current.params);
    showToast('Registro atualizado');
    return false;
  },
};

/* =========================================================
   EXTERNAL SEARCH (Google Books API)
========================================================= */
const Search = {
  _lastQuery: '',
  _results: [],

  init(){
    const results = document.getElementById('search-results');
    if(results) results.innerHTML = '';
  },

  onInput(value){
    clearTimeout(this._debounce);
    const q = value.trim();
    this._debounce = setTimeout(() => this.run(q), 380);
  },

  async run(q){
    const results = document.getElementById('search-results');
    if(!results) return;
    if(!q){ results.innerHTML = ''; return; }
    this._lastQuery = q;
    results.innerHTML = `<div class="search-loading">Buscando "${escapeHtml(q)}"...</div>`;

    try{
      const res = await fetchWithTimeout(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books`);
      if(this._lastQuery !== q) return;
      if(!res.ok) throw new Error('bad response');
      const json = await res.json();
      const items = (json.items || []).filter(it => it.volumeInfo && it.volumeInfo.title);
      this._results = items;

      if(!items.length){
        results.innerHTML = `<div class="search-empty">Nenhum resultado para "${escapeHtml(q)}". Tente outro título ou autor(a).</div>`;
        return;
      }

      results.innerHTML = items.map((it, i) => {
        const info = it.volumeInfo;
        const author = (info.authors && info.authors[0]) || 'Autor desconhecido';
        const cover = googleBooksCover(info);
        const year = info.publishedDate ? info.publishedDate.slice(0, 4) : '';
        return `
          <div class="result-card card-tap fade-in" style="animation-delay:${Math.min(i, 8) * 30}ms" role="button" onclick="Search.pick(${i})">
            <div class="thumb">${cover ? `<img src="${cover}" alt="" loading="lazy">` : ''}</div>
            <div class="meta">
              <p>${escapeHtml(info.title)}</p>
              <p>${escapeHtml(author)}${year ? ' · ' + year : ''}</p>
            </div>
            <span class="msym" style="font-size:16px; color:var(--ink-faint); flex-shrink:0;">chevron_right</span>
          </div>
        `;
      }).join('');
    }catch(err){
      if(this._lastQuery !== q) return;
      results.innerHTML = `<div class="search-empty">Não foi possível buscar agora. Verifique sua conexão e tente novamente.</div>`;
    }
  },

  pick(index){
    const it = this._results[index];
    if(!it) return;
    const info = it.volumeInfo;
    const author = (info.authors && info.authors[0]) || 'Autor desconhecido';
    const cover = googleBooksCover(info, true);
    this._picked = { title: info.title, author, cover, totalPages: info.pageCount || null };

    document.getElementById('search-add-preview').innerHTML = `
      <div class="result-card" style="margin-bottom:16px;">
        <div class="thumb">${cover ? `<img src="${cover}" alt="">` : ''}</div>
        <div class="meta">
          <p>${escapeHtml(info.title)}</p>
          <p>${escapeHtml(author)}</p>
        </div>
      </div>
    `;
    Modals.open('modal-search-add');
  },

  confirmAdd(){
    if(!this._picked) return;
    const status = document.getElementById('sa-status').value;
    const book = Books.add({ ...this._picked, status });
    Modals.close('modal-search-add');
    Router.go('livro', { id: book.id });
    showToast('Livro adicionado à estante');
  },
};

/* =========================================================
   SETTINGS
========================================================= */
const Settings = {
  saveName(){
    const name = document.getElementById('settings-name').value.trim();
    const err = document.getElementById('settings-error');
    if(!name){ err.innerHTML = '<div class="form-error">O nome não pode ficar vazio.</div>'; return; }
    err.innerHTML = '';
    const users = Auth.getUsers();
    const user = Auth.currentUser();
    const u = users.find(x => x.id === user.id);
    u.name = name;
    Auth.saveUsers(users);
    document.getElementById('topbar-avatar').textContent = initials(name);
    showToast('Nome atualizado');
  },

  async changePassword(){
    const current = document.getElementById('settings-current-password').value;
    const next = document.getElementById('settings-new-password').value;
    const err = document.getElementById('password-error');
    err.innerHTML = '';

    const user = Auth.currentUser();
    const currentHash = await sha256(current);
    if(currentHash !== user.passwordHash){
      err.innerHTML = '<div class="form-error">Senha atual incorreta.</div>';
      return;
    }
    if(!/^\d{4}$/.test(next)){
      err.innerHTML = '<div class="form-error">A nova senha precisa ter exatamente 4 dígitos.</div>';
      return;
    }
    const users = Auth.getUsers();
    const u = users.find(x => x.id === user.id);
    u.passwordHash = await sha256(next);
    Auth.saveUsers(users);
    document.getElementById('settings-current-password').value = '';
    document.getElementById('settings-new-password').value = '';
    showToast('Senha atualizada');
  },

  exportData(){
    const user = Auth.currentUser();
    const data = Data.get();
    const payload = { user: { name: user.name, username: user.username }, ...data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'booky-dados.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  },

  confirmClearData(){
    Modals.confirm({
      title: 'Apagar todos os livros',
      message: 'Isso vai remover permanentemente todos os seus livros e registros de leitura. Sua conta continua ativa.',
      onConfirm: () => {
        Data.save({ books: [], entries: [] });
        Modals.close('modal-confirm');
        Router.go('inicio');
        showToast('Dados apagados');
      }
    });
  },
};

/* =========================================================
   MODALS
========================================================= */
const Modals = {
  open(id){ document.getElementById(id).classList.add('open'); renderIcons(); },
  close(id){ document.getElementById(id).classList.remove('open'); },

  openBookPicker(){
    const { books } = Data.get();
    const sorted = [...books].sort((a, b) => {
      if(a.status === 'lendo' && b.status !== 'lendo') return -1;
      if(b.status === 'lendo' && a.status !== 'lendo') return 1;
      return b.updatedAt - a.updatedAt;
    });
    document.getElementById('book-picker-list').innerHTML = sorted.map(b => `
      <div class="result-card card-tap" role="button" onclick="QuickActions.pickBookForRegistro('${b.id}')">
        <div class="thumb">${bookCoverHtml(b)}</div>
        <div class="meta">
          <p>${escapeHtml(b.title)}</p>
          <p>${escapeHtml(b.author)}</p>
        </div>
        <span class="status-pill status-${b.status}" style="flex-shrink:0;">${STATUS_LABEL[b.status]}</span>
      </div>
    `).join('');
    this.open('modal-book-picker');
  },

  confirm({ title, message, onConfirm }){
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    const btn = document.getElementById('confirm-ok-btn');
    const clone = btn.cloneNode(true);
    btn.parentNode.replaceChild(clone, btn);
    clone.addEventListener('click', onConfirm);
    this.open('modal-confirm');
  },
};

const QuickActions = {
  registrarLeitura(){
    const { books } = Data.get();
    if(!books.length){
      showToast('Busque um livro para adicionar primeiro');
      Router.go('busca');
      return;
    }
    const reading = books.filter(b => b.status === 'lendo');
    if(reading.length === 1){
      Router.go('registro', { id: reading[0].id });
      return;
    }
    Modals.openBookPicker();
  },

  pickBookForRegistro(id){
    Modals.close('modal-book-picker');
    Router.go('registro', { id });
  },
};

/* =========================================================
   APP INIT
========================================================= */
const App = {
  boot(){
    const user = Auth.currentUser();
    const authScreen = document.getElementById('auth-screen');
    const shell = document.getElementById('app-shell');

    if(user){
      authScreen.style.display = 'none';
      shell.classList.add('active');
      document.getElementById('topbar-avatar').textContent = initials(user.name);
      if(!location.hash || location.hash === '#/') location.hash = '/inicio';
      Router.onHashChange();
    }else{
      shell.classList.remove('active');
      authScreen.style.display = 'flex';
      renderIcons();
    }
  },
};

Router.init();
document.addEventListener('DOMContentLoaded', () => App.boot());
</script>
